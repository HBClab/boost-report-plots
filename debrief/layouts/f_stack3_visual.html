<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Activity Report — Lab {{LAB_ID_PLAIN}}</title>
  <style>
{{BASE_CSS}}
    /* F — Michelle longer-term stack: Activity → Sleep (WP) → visual fitness */
    .page-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    @media print {
      .report-card--activity .activity-panel .activity-chart img { max-height: 1.85in; object-fit: contain; }
      .report-card--sleep .sleep-panel img { max-height: 2.05in; object-fit: contain; }
      .fitness-visual img { max-height: 1.55in; object-fit: contain; }
      .fitness-visual img.sessions-bar { max-height: 0.55in; }
      .fitness-visual img.hr-tiles { max-height: 0.75in; }
    }
  </style>
</head>
<body>
  <section class="slide1 layout-f-stack3-visual">
    {{HEADER}}
    <div class="page-body">
      {{ACTIVITY}}
      {{SLEEP_WP}}
      {{FITNESS_VISUAL}}
    </div>
    <p class="meta-footer">BOOST ID {{SUBJECT_ID}} · {{COHORT}} · generated {{GENERATED}} · layout f_stack3_visual</p>
  </section>
</body>
</html>
