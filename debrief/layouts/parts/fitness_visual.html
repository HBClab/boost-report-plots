<div class="report-card report-card--fitness fitness-visual">
  <div class="fitness-section">
    <h2>Exercise Training and Fitness</h2>
    <p class="chart-section-subtitle" style="margin-bottom:4px">{{EXercise_RANGE}}</p>
    <img class="sessions-bar" alt="Sessions completed progress"
         src="data:image/png;base64,{{FITNESS_SESSIONS_CHART}}">
    <img alt="Pre to post fitness metrics table"
         src="data:image/png;base64,{{FITNESS_PREPOST_CHART}}">
    <img class="hr-tiles" alt="Heart rate zone targets"
         src="data:image/png;base64,{{FITNESS_HR_CHART}}">
    <p style="font-size:10px;text-align:center;margin:4px 0 0;color:#444">
      Max HR: <strong>{{HR_MAX_PLAIN}}</strong>
    </p>
  </div>
</div>
