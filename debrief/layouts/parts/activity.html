<div class="report-card report-card--activity">
  <h3 class="chart-section-title">Average Daily Hours of Activity and Sleep per Wear Period</h3>
  <div class="activity-panel">
    <div class="activity-chart">
      <img alt="Activity composition by wear period"
           src="data:image/png;base64,{{ACTIVITY_CHART}}">
    </div>
  </div>
  <div class="chart-legend" aria-label="Activity chart color key">
    <span><i class="sw-sleep"></i>Sleep</span>
    <span><i class="sw-sed"></i>Sedentary</span>
    <span><i class="sw-light"></i>Light</span>
    <span><i class="sw-mvpa"></i>MVPA</span>
  </div>
</div>
